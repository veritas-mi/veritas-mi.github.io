<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Endpoint Not Located | Veritas Market Insights</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <style>
    :root {
      --vmi-navy: #0A2540;
      --vmi-teal: #00D09C;
      --vmi-teal-dark: #00A87D;
      --vmi-bg-slate: #F8FAFC;
      --vmi-white: #FFFFFF;
      --vmi-text-main: #0F172A;
      --vmi-text-muted: #475569;
      --vmi-border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--vmi-navy);
      color: var(--vmi-white);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }

    .error-container {
      max-width: 560px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid var(--vmi-teal);
      border-radius: 8px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .status-code {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--vmi-teal);
      line-height: 1;
      margin-bottom: 1rem;
    }

    .section-tag {
      color: #94A3B8;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    p {
      color: #94A3B8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .home-btn {
      display: inline-block;
      background-color: var(--vmi-teal);
      color: var(--vmi-navy);
      padding: 0.85rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .home-btn:hover {
      background-color: var(--vmi-teal-dark);
      color: var(--vmi-white);
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="status-code">404</div>
    <div class="section-tag">Forensic Analysis Protocol</div>
    <h1>Requested Endpoint Not Located</h1>
    <p>The operational page, dossier, or intelligence resource you requested does not exist or has been relocated to maintain archival integrity.</p>
    <a href="/" class="home-btn">&larr; Return to Executive Overview</a>
  </div>

</body>
</html>
